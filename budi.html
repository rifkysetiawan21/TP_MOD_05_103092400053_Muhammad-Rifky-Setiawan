
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
                <li class="nav-item"><a class="nav-link" href="#tentang">Tentang</a></li>
                <li class="nav-item"><a class="nav-link" href="#bantuan">Bantuan</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Login Card -->
                <div class="card border-0 shadow rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <!-- Login Heading -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-2">Selamat Datang</h2>
                            <p class="text-secondary mb-0">Silakan masuk ke akun Ruang Baca Anda.</p>
                        </div>

                        <!-- Login Form -->
                        <form action="#" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                            </div>

                            <!-- Remember Me and Forgot Password -->
                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ingatSaya" name="ingatSaya">
                                    <label class="form-check-label" for="ingatSaya">Ingat saya</label>
                                </div>
                                <a href="#bantuan" class="link-primary text-decoration-none small">Lupa password?</a>
                            </div>

                            <!-- Login Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Masuk</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="container-fluid bg-white border-top py-3">
    <div class="container text-center text-secondary">
        <small>&copy; 2026 Ruang Baca. Semua hak dilindungi.</small>
    </div>
</footer>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
